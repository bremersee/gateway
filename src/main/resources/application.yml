spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true
          route-refresh-listener:
            enabled: true
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - "*"
                allowed-methods:
                  - "*"
                allowed-headers:
                  - "*"
  security:
    oauth2:
      client:
        provider:
          swagger-ui:
            authorization-uri: ${bremersee.keycloak.base-uri}/realms/${bremersee.keycloak.realm}/protocol/openid-connect/auth
            token-uri: ${bremersee.keycloak.base-uri}/realms/${bremersee.keycloak.realm}/protocol/openid-connect/token

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: "*"
      cors:
        allowed-headers: "*"
        allowed-methods: "*"
        allowed-origins: "*"
  endpoint:
    health:
      show-details: when_authorized

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

logging:
  level:
    ROOT: info
    com.netflix.eureka.registry: warn
    com.netflix.discovery.shared.resolver: warn
    org.springframework.cloud.configclient: warn

bremersee:
  exception-mapping:
    api-paths:
      - /*/api/**
    default-exception-mapping-config:
      include-stack-trace: true
      include-cause: true
      include-application-name: true
      include-handler: true
      include-path: true
  web:
    cors:
      enabled: true
  keycloak:
    base-uri: https://openid.bremersee.org
    realm: eixe

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    oauth:
      client-id: local-pkce
      use-pkce-with-authorization-code-grant: true
  open-api:
    # see: https://github.com/OAI/OpenAPI-Specification/blob/3.1.1/versions/3.1.1.md#info-object
    info:
      version: 1.0.5-SNAPSHOT
      title: Gateway API
      summary: The gateway.
      description: RESTful services of gateway.
      # termsOfService: https://example.com/terms/
      # contact:
      #   name: API Support
      #   url: https://www.example.com/support
      #   email: support@example.com
      license:
        name: Apache 2.0
        url: https://www.apache.org/licenses/LICENSE-2.0.html
    # Generates default server (localhost)
    # servers:
    #  - url: https://apps.eixe.bremersee.org/groupman
    #    description: Group Manager API

---

spring:
  config:
    activate:
      on-profile: in-memory

bremersee:
  authentication:
    in-memory:
      enabled: true
      users:
        - name: ${USER_NAME:user}
          password: ${USER_PASSWORD:changeit}
          authorities:
            - ROLE_USER
        - name: ${ACTUATOR_USER_NAME:actuator}
          password: ${ACTUATOR_USER_PASSWORD:changeit}
          authorities:
            - ROLE_ACTUATOR
        - name: ${ADMIN_NAME:admin}
          password: ${ADMIN_PASSWORD:changeit}
          authorities:
            - ROLE_ADMIN
            - ROLE_ACTUATOR_ADMIN

---

spring:
  config:
    activate:
      on-profile: test

  security:
    user:
      name: testuser
      password: changeit
      roles:
        - "USER"
        - "LOCAL_USER"
        - "ADMIN"
        - "ACTUATOR_ADMIN"
